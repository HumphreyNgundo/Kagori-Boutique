name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Builds must pass with no storage attached — the app falls back to
          # the in-memory driver, so a missing token can never break a deploy.
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Smoke test the production server
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ >/dev/null; then break; fi
            sleep 1
          done
          fail=0
          for path in / /shop /c/wigs /p/aria-body-wave-hd-lace /cart /track /help /login; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "$code $path"
            [ "$code" = "200" ] || fail=1
          done
          kill $SERVER_PID
          exit $fail
